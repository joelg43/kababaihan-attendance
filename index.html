<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kababaihan QR Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f2f5f9;color:#202938;font-family:Arial,sans-serif}
main{max-width:480px;margin:auto;padding:22px;background:white;border-radius:18px;box-shadow:0 4px 20px #00000012}
h2,.subtitle{text-align:center}
.subtitle,.note{color:#657185;font-size:14px;line-height:1.5}
#reader{width:100%;margin-top:16px}
#status{margin:16px 0;padding:12px;border-radius:8px;background:#edf2f7;overflow-wrap:anywhere}
#member{display:none;padding:14px;border:1px solid #dbe3ed;border-radius:12px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;background:#147d48;color:white}
button:disabled{opacity:.6}
#nextBtn{display:none;background:#e5eaf1;color:#243348}
.note{text-align:center;font-size:12px}
.success{background:#e4f7eb!important;color:#146c37}
.duplicate{background:#fff3cd!important;color:#795900}
.error{background:#fde8e8!important;color:#a32121}
</style>
</head>
<body>
<main>
<h2>Kababaihan Attendance</h2>
<p class="subtitle">Scan the member's QR code to record attendance.</p>

<div id="reader"></div>

<div id="status" role="status" aria-live="polite">
Press Start Camera and allow camera access.
</div>

<section id="member">
<h3>Scanned Member</h3>
<p><b>ID:</b> <span id="memberId"></span></p>
<p><b>Name:</b> <span id="memberName"></span></p>
<p><b>Barangay:</b> <span id="memberBarangay"></span></p>
</section>

<button id="startBtn" onclick="startScanner()">Start Camera</button>
<button id="nextBtn" onclick="startScanner()">Scan Another QR Code</button>

<p class="note">Wait for the saved or duplicate confirmation before scanning the next member.</p>
</main>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbx4qZCHjfgmcciOsSDRX4-CJl5g-fgLkAkao1EOd_9yI2vllMTsH98NP_79wo3aWk-P/exec';

let scanner = null;
let busy = false;

const statusBox = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const memberBox = document.getElementById('member');

function showStatus(message, type) {
  statusBox.textContent = message;
  statusBox.className = type || '';
}

async function startScanner() {
  if (busy) return;

  nextBtn.style.display = 'none';
  startBtn.disabled = true;
  startBtn.style.display = 'block';
  memberBox.style.display = 'none';
  showStatus('Opening camera...');

  try {
    if (!scanner) scanner = new Html5Qrcode('reader');

    if (scanner.isScanning) {
      await scanner.stop();
    }

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: function(width, height) {
          const size = Math.floor(Math.min(width, height) * 0.75);
          return {width:size,height:size};
        }
      },
      handleScan,
      function(){}
    );

    startBtn.style.display = 'none';
    showStatus('Camera ready. Point it at a member QR code.');
  } catch(err) {
    startBtn.disabled = false;
    showStatus(
      'Camera could not start: ' + (err.message || err) +
      '. Allow camera access and open this page directly in Chrome.',
      'error'
    );
  }
}

async function handleScan(decodedText) {
  if (busy) return;
  busy = true;

  try {
    const data = JSON.parse(decodedText);

    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      throw new Error('QR content must be a JSON object.');
    }

    const member = {
      id: String(data.id || '').trim(),
      name: String(data.name || '').trim(),
      barangay: String(data.barangay || '').trim()
    };

    if (!member.name) throw new Error('QR code is missing the member name.');

    if (!member.id && !member.barangay) {
      throw new Error('QR must contain an ID or a barangay with the name.');
    }

    if (scanner && scanner.isScanning) {
      await scanner.stop();
    }

    document.getElementById('memberId').textContent = member.id || 'Not provided';
    document.getElementById('memberName').textContent = member.name;
    document.getElementById('memberBarangay').textContent = member.barangay || 'Not provided';
    memberBox.style.display = 'block';

    showStatus('Checking attendance for ' + member.name + '...');
    startBtn.style.display = 'none';

    saveAttendance(member);

  } catch(err) {
    busy = false;
    showStatus('Invalid QR code: ' + (err.message || err), 'error');

    if (!scanner || !scanner.isScanning) {
      startBtn.disabled = false;
      startBtn.style.display = 'block';
    }
  }
}

function saveAttendance(member) {
  const callbackName = 'attendanceCallback_' + Date.now() +
    '_' + Math.floor(Math.random() * 100000);

  const script = document.createElement('script');

  const params = new URLSearchParams({
    action: 'save',
    callback: callbackName,
    id: member.id,
    name: member.name,
    barangay: member.barangay,
    _: String(Date.now())
  });

  let finished = false;

  function cleanup() {
    if (finished) return;
    finished = true;
    script.remove();
    try { delete window[callbackName]; } catch(e) {}
  }

  const timeout = setTimeout(function() {
    cleanup();
    busy = false;
    startBtn.disabled = false;
    startBtn.style.display = 'block';
    nextBtn.style.display = 'none';
    showStatus('No response from server. Check internet and deployment.', 'error');
  }, 20000);

  window[callbackName] = function(result) {
    if (finished) return;

    clearTimeout(timeout);
    cleanup();
    busy = false;

    if (result && result.success) {
      showStatus('SUCCESS: Attendance saved for ' + result.name + '.', 'success');
      alert('SUCCESS!\nAttendance saved for ' + result.name);
      nextBtn.textContent = 'Scan Another QR Code';
      nextBtn.style.display = 'block';
      startBtn.style.display = 'none';

    } else if (result && (result.duplicate || result.code === 'DUPLICATE')) {
      showStatus(
        'DUPLICATE: ' + (result.message || 'Attendance already recorded.'),
        'duplicate'
      );
      alert('DUPLICATE!\nThis member is already recorded.');
      nextBtn.textContent = 'Scan Next Member';
      nextBtn.style.display = 'block';
      startBtn.style.display = 'none';

    } else {
      showStatus(
        'SAVE FAILED: ' + ((result && result.message) || 'Unknown server error.'),
        'error'
      );
      nextBtn.textContent = 'Try Again / Scan Another';
      nextBtn.style.display = 'block';
      startBtn.style.display = 'none';
    }
  };

  script.onerror = function() {
    if (finished) return;
    clearTimeout(timeout);
    cleanup();
    busy = false;
    showStatus('Could not contact attendance server. Check the /exec URL and deployment access.', 'error');
    nextBtn.textContent = 'Try Again';
    nextBtn.style.display = 'block';
  };

  script.src = API_URL + '?' + params.toString();
  document.body.appendChild(script);
}
</script>
</body>
</html>
